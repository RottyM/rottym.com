<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RottyM Full Lockup Logo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1200px;
      height: 1200px;
      overflow: hidden;
      background-color: #080c14;
      background-image: 
        radial-gradient(circle at 50% 45%, rgba(0, 242, 254, 0.16) 0%, rgba(0, 245, 160, 0.06) 40%, transparent 72%),
        radial-gradient(rgba(255, 255, 255, 0.07) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .ambient-glow {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.20) 0%, rgba(79, 172, 254, 0.08) 45%, transparent 70%);
      filter: blur(80px);
      pointer-events-none;
    }

    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 32px;
    }

    svg {
      width: 480px;
      height: 520px;
      overflow: visible;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8));
    }

    .wordmark {
      font-size: 88px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.7));
    }

    .wordmark-rotty {
      color: #FFFFFF;
    }

    .wordmark-m {
      color: #00F2FE;
      background: linear-gradient(135deg, #00F2FE 0%, #4FACFE 50%, #00F5A0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-left: 2px;
    }

    .subtitle-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 28px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 242, 254, 0.3);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .subtitle-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00F5A0;
      box-shadow: 0 0 10px #00F5A0;
    }

    .subtitle-text {
      color: #94A3B8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .tag-location {
      color: #00F2FE;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  
  <div class="content">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -8 156 168" fill="none">
      <defs>
        <linearGradient id="rotty-r" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00F2FE" />
          <stop offset="45%" stop-color="#4FACFE" />
          <stop offset="100%" stop-color="#6B11FF" />
        </linearGradient>

        <linearGradient id="rotty-m" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00F5A0" />
          <stop offset="100%" stop-color="#00F5A0" />
        </linearGradient>

        <filter id="rotty-neon" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="8" result="blur1" />
          <feGaussianBlur stdDeviation="16" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="rotty-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.95" />
          <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
          <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00F2FE" flood-opacity="0.25" />
        </filter>

        <filter id="rotty-m-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.95" />
          <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00F5A0" flood-opacity="0.55" />
        </filter>
      </defs>

      <g>
        <path
          d="M 28 148 L 28 22 C 28 10 37 0 49 0 L 88 0 C 114 0 134 18 134 44 C 134 68 116 85 92 88 L 138 148"
          fill="none"
          stroke="#00F2FE"
          stroke-width="16"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.22"
          filter="url(#rotty-neon)"
        />

        <g filter="url(#rotty-shadow)">
          <rect
            x="20"
            y="4"
            width="18"
            height="144"
            rx="9"
            fill="url(#rotty-r)"
          />
          <path
            d="M 34 13 H 84 C 108 13 124 28 124 49 C 124 70 108 85 84 85 H 34"
            fill="none"
            stroke="url(#rotty-r)"
            stroke-width="18"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M 72 82 L 128 148"
            fill="none"
            stroke="url(#rotty-r)"
            stroke-width="18"
            stroke-linecap="round"
          />
        </g>

        <path
          d="M 29 148 L 29 13 H 84 C 108 13 124 28 124 49 C 124 70 108 85 84 85 L 128 148"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.9"
        />

        <path
          d="M 106 20 L 124 42 L 154 8"
          fill="none"
          stroke="#080c14"
          stroke-width="20"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M 106 20 L 124 42 L 154 8"
          fill="none"
          stroke="url(#rotty-m)"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#rotty-m-shadow)"
        />

        <circle
          cx="154"
          cy="8"
          r="14"
          fill="none"
          stroke="#00F5A0"
          stroke-width="2"
          opacity="0.85"
        />
        <circle
          cx="154"
          cy="8"
          r="8"
          fill="none"
          stroke="#00F2FE"
          stroke-width="1.5"
          opacity="0.7"
        />
        <circle
          cx="154"
          cy="8"
          r="6"
          fill="#FFFFFF"
          filter="drop-shadow(0 0 6px #00F5A0)"
        />
        <circle
          cx="154"
          cy="8"
          r="2.5"
          fill="#00F5A0"
        />
      </g>
    </svg>

    <div class="wordmark">
      <span class="wordmark-rotty">Rotty</span><span class="wordmark-m">M</span>
    </div>

    <div class="subtitle-badge">
      <div class="subtitle-dot"></div>
      <div class="subtitle-text">FULL-STACK &amp; AI SOFTWARE ENGINEER &nbsp;·&nbsp; <span class="tag-location">RESTON, VA</span></div>
    </div>
  </div>
</body>
</html>
